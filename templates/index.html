<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IA Profissional Real</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div>
        <h1>IA Profissional Real</h1>
        <p>Agente com memória, arquivos e terminal</p>
      </div>
      <div class="user-badge" id="user-badge">Usuário</div>
    </header>

    <main class="chat-panel">
      <div id="chat" class="chat"></div>
      <div class="composer">
        <textarea id="prompt" placeholder="Digite sua tarefa... Ex.: liste os arquivos desta pasta"></textarea>
        <button id="send-btn">Enviar</button>
      </div>
    </main>
  </div>

  <script>
    const username = localStorage.getItem('ia_user');
    if (!username) {
      window.location.href = '/login';
    }

    const userBadge = document.getElementById('user-badge');
    userBadge.textContent = username;

    const chat = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `<strong>${role === 'user' ? 'Você' : 'IA'}:</strong><div>${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    sendBtn.addEventListener('click', async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      promptEl.value = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, prompt })
        });

        const data = await response.json();
        addMessage('assistant', data.response || 'Sem resposta.');
      } catch (error) {
        addMessage('assistant', 'Erro ao processar a mensagem: ' + error.message);
      }
    });
  </script>
</body>
</html>
